<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fira+Sans+Condensed:wght@600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
[data-eco]{--e:cubic-bezier(.22,1,.36,1)}
[data-eco] [data-ecf]{opacity:0;transform:translate3d(0,16px,0);transition:opacity 360ms var(--e),transform 360ms var(--e)}
[data-eco][data-in] [data-ecf]{opacity:1;transform:none}
[data-eco] [data-ecl]{transform:scale(0,1);transition:transform 360ms var(--e) calc(360ms + var(--k) * 60ms)}
[data-eco] [data-ecl][data-v]{transform:scale(1,0)}
[data-eco][data-in] [data-ecl]{transform:none}
[data-ecc]{transition:background-color 200ms var(--e)}
a[data-ecc]:hover{background:#262B31}
a[data-ecc]:hover [data-eci]{background:#3B4148}
a[data-ecc]:focus-visible{outline:2px solid #E0001B;outline-offset:-2px}
[data-eci]{transition:background-color 200ms var(--e)}
[data-eca]{transition:background-color 200ms var(--e),color 200ms var(--e),transform 200ms var(--e)}
a[data-ecc]:hover [data-eca]{background:#F4F5F6;color:#E0001B;transform:rotate(45deg)}
a[data-ecc]:active{transform:scale(.99)}
@media (prefers-reduced-motion:reduce){[data-eco] [data-ecf],[data-eco] [data-ecl]{opacity:1;transform:none;transition:none}}
</style>
</helmet>
<section aria-labelledby="{{ hid }}" data-screen-label="07 Екосистема" style="width:100%;box-sizing:border-box;background:#0F1114;padding:{{ pad }};">
<div style="max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:{{ headGap }};">
<div style="display:flex;flex-direction:column;align-items:flex-start;gap:16px;">
<div style="font:500 14px/1.45 'IBM Plex Sans',sans-serif;letter-spacing:0.08em;text-transform:uppercase;color:#A9AFB6;">Екосистема</div>
<h2 id="{{ hid }}" style="margin:0;font:600 {{ h2 }};letter-spacing:{{ h2ls }};color:#F4F5F6;">Усе під <span style="color:#8F8F92;">одним дахом</span></h2>
<p style="margin:8px 0 0;max-width:680px;font:400 18px/1.55 'IBM Plex Sans',sans-serif;color:#A9AFB6;text-wrap:pretty;">Ремонт, запчастини та розбірка&nbsp;— на одному майданчику. Не чекаємо постачальників і не ганяємо вас по місту.</p>
</div>

<div data-eco="" ref="{{ root }}">
<ul data-ecf="" aria-label="Екосистема DLS" style="margin:0;padding:0;list-style:none;display:grid;grid-template-columns:{{ cols }};border-radius:{{ frameR }};background:#181B1F;box-shadow:inset 0 0 0 1px #262B31;overflow:hidden;">
<sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
<li style="position:relative;display:flex;min-width:0;box-shadow:{{ c.sep }};">
<sc-if value="{{ c.dPrev }}" hint-placeholder-val="{{ false }}"><span data-ecl="" aria-hidden="true" style="--k:{{ c.k1 }};position:absolute;z-index:1;pointer-events:none;top:56px;left:0;width:56px;height:1px;background:#3B4148;transform-origin:0 0;"></span></sc-if>
<sc-if value="{{ c.dNext }}" hint-placeholder-val="{{ false }}"><span data-ecl="" aria-hidden="true" style="--k:{{ c.k2 }};position:absolute;z-index:1;pointer-events:none;top:56px;left:56px;right:0;height:1px;background:#3B4148;transform-origin:0 0;"></span></sc-if>
<sc-if value="{{ c.mPrev }}" hint-placeholder-val="{{ false }}"><span data-ecl="" data-v="" aria-hidden="true" style="--k:{{ c.k1 }};position:absolute;z-index:1;pointer-events:none;left:48px;top:0;width:1px;height:48px;background:#3B4148;transform-origin:0 0;"></span></sc-if>
<sc-if value="{{ c.mNext }}" hint-placeholder-val="{{ false }}"><span data-ecl="" data-v="" aria-hidden="true" style="--k:{{ c.k2 }};position:absolute;z-index:1;pointer-events:none;left:48px;top:48px;bottom:0;width:1px;background:#3B4148;transform-origin:0 0;"></span></sc-if>
<sc-if value="{{ c.isLink }}" hint-placeholder-val="{{ true }}">
<a href="{{ c.href }}" data-ecc="" style="position:relative;flex:1;display:flex;flex-direction:column;gap:{{ cGap }};padding:{{ cPad }};color:#F4F5F6;">
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
<span data-eci="" aria-hidden="true" style="position:relative;z-index:2;flex-shrink:0;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:999px;background:#262B31;box-shadow:0 0 0 1px #3B4148;color:#F4F5F6;"><span style="width:24px;height:24px;background:currentColor;-webkit-mask:{{ c.mask }};mask:{{ c.mask }};"></span></span>
<sc-if value="{{ c.here }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:999px;background:#F4F5F6;font:500 14px/1 'IBM Plex Sans',sans-serif;color:#0F1114;white-space:nowrap;"><span aria-hidden="true" style="width:6px;height:6px;border-radius:999px;background:#E0001B;"></span>Ви тут</span></sc-if>
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<h3 style="margin:0;font:600 {{ h4 }};color:#F4F5F6;">{{ c.t }}</h3>
<p style="margin:0;font:400 16px/1.5 'IBM Plex Sans',sans-serif;color:#A9AFB6;text-wrap:pretty;">{{ c.d }}</p>
</div>
<div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px;font:500 16px/1.5 'IBM Plex Sans',sans-serif;color:#F4F5F6;">{{ c.link }}<span data-eca="" aria-hidden="true" style="flex-shrink:0;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;background:#3B4148;color:#F4F5F6;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></span></div>
</a>
</sc-if>
<sc-if value="{{ c.isStatic }}" hint-placeholder-val="{{ false }}">
<div data-ecc="" style="position:relative;flex:1;display:flex;flex-direction:column;gap:{{ cGap }};padding:{{ cPad }};color:#F4F5F6;">
<div style="display:flex;align-items:center;"><span data-eci="" aria-hidden="true" style="position:relative;z-index:2;flex-shrink:0;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:999px;background:#262B31;box-shadow:0 0 0 1px #3B4148;color:#F4F5F6;"><span style="width:24px;height:24px;background:currentColor;-webkit-mask:{{ c.mask }};mask:{{ c.mask }};"></span></span></div>
<div style="display:flex;flex-direction:column;gap:8px;">
<h3 style="margin:0;font:600 {{ h4 }};color:#F4F5F6;">{{ c.t }}</h3>
<p style="margin:0;font:400 16px/1.5 'IBM Plex Sans',sans-serif;color:#A9AFB6;text-wrap:pretty;">{{ c.d }}</p>
</div>
<div style="margin-top:auto;display:flex;align-items:center;min-height:32px;font:400 14px/1.45 'IBM Plex Sans',sans-serif;color:#A9AFB6;">{{ c.note }}</div>
</div>
</sc-if>
</li>
</sc-for>
</ul>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mob&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const IC = {
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  warehouse: '<path d="M18 21V10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v11"/><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 1.132-1.803l7.95-3.974a2 2 0 0 1 1.837 0l7.95 3.974A2 2 0 0 1 22 8z"/><path d="M6 13h12"/><path d="M6 17h12"/>',
  pkg: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="M3.29 7 12 12l8.71-5"/><path d="m7.5 4.27 9 5.15"/>'
};
const m = (k) => 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + IC[k] + '</svg>') + '") center / contain no-repeat';
const CARDS = [
  { t: 'СТО DLS', d: 'Складний ремонт рамної техніки, діагностика, ТО', icon: 'wrench', here: true, href: '#services', link: 'Усі послуги' },
  { t: 'Авторозбірка DLS', d: 'Б/в запчастини з власного складу — підбираємо на місці, без очікування', icon: 'warehouse', href: '/rozbirka', link: 'Про розбірку' },
  { t: 'Нові запчастини та аналоги', d: 'Оригінал або аналог — менеджер пропонує варіанти, ви обираєте за ціною', icon: 'pkg', note: 'Під час узгодження кошторису' }
];
class Component extends DCLogic {
  root = React.createRef();
  componentDidMount() {
    const el = this.root.current; if (!el) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.dataset.in = '1'; return; }
    this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { el.dataset.in = '1'; this.io.disconnect(); } }), { threshold: 0.25 });
    this.io.observe(el);
    this.fb = setTimeout(() => { el.dataset.in = '1'; }, 1500);
  }
  componentWillUnmount() { this.io && this.io.disconnect(); clearTimeout(this.fb); }
  renderVals() {
    const mob = !!this.props.mob, P = mob ? 24 : 32, C = P + 24;
    const cards = CARDS.map((c, i) => {
      const first = i === 0, last = i === CARDS.length - 1;
      return {
        ...c, mask: m(c.icon), isLink: !!c.href, isStatic: !c.href, here: !!c.here,
        sep: first ? 'none' : (mob ? 'inset 0 1px 0 #262B31' : 'inset 1px 0 0 #262B31'),
        dPrev: !mob && !first, dNext: !mob && !last, mPrev: mob && !first, mNext: mob && !last, k1: i * 2 - 1, k2: i * 2
      };
    });
    return {
      hid: mob ? 'eco-hm' : 'eco-h', root: this.root, cards,
      pad: mob ? '64px 16px' : '96px 24px', headGap: mob ? '32px' : '48px',
      h2: mob ? "32px/1.15 'Fira Sans Condensed',sans-serif" : "48px/1.15 'Fira Sans Condensed',sans-serif", h2ls: mob ? '-0.01em' : '-0.02em',
      h4: mob ? "20px/1.25 'Fira Sans Condensed',sans-serif" : "24px/1.25 'Fira Sans Condensed',sans-serif",
      cols: mob ? 'minmax(0,1fr)' : 'repeat(3,minmax(0,1fr))', frameR: mob ? '24px' : '32px',
      cPad: mob ? '24px' : '32px', cGap: mob ? '32px' : '64px'
    };
  }
}
</script>
</body>
</html>
