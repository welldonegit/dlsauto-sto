<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
[data-lsc]{background:#181B1F;border-color:#262B31}

[data-lsf]{outline:none;background:#262B31;box-shadow:inset 0 0 0 1px transparent;transition:background-color 200ms cubic-bezier(.22,1,.36,1),box-shadow 200ms cubic-bezier(.22,1,.36,1)}
[data-lsf]:hover{background:#3B4148}
[data-lsf]:focus{background:#0F1114!important;box-shadow:inset 0 0 0 1px #7D848D}
[data-lsf]:-webkit-autofill,[data-lsf]:-webkit-autofill:hover,[data-lsf]:-webkit-autofill:focus{-webkit-text-fill-color:#F4F5F6;-webkit-box-shadow:inset 0 0 0 1000px #262B31;caret-color:#F4F5F6;transition:background-color 9999s}
[data-lsf][aria-invalid="true"]{box-shadow:inset 0 0 0 1px #F2707A}
[data-lsf]::placeholder{color:#A9AFB6;opacity:1}
[data-lsf][data-empty]{color:#A9AFB6!important}
[data-lsf] option{background:#262B31;color:#F4F5F6}
[data-ls-dot]{position:relative}
[data-ls-dot][data-open]::after{content:"";position:absolute;inset:0;border-radius:999px;background:#2F9E5B;animation:lsPulse 2s cubic-bezier(.22,1,.36,1) infinite}
@keyframes lsPulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
[data-ls-ph]{transition:background-color 200ms cubic-bezier(.22,1,.36,1)}[data-ls-ph]:hover{background:var(--text-2)!important}
[data-ls-tl]{text-decoration:underline 1px;text-decoration-color:var(--border);text-underline-offset:6px;transition:text-decoration-color 200ms ease,color 200ms ease}[data-ls-tl]:hover{text-decoration-color:currentColor}
[data-ls-cl]{text-decoration:underline 1px;text-decoration-color:#5A616A;text-underline-offset:4px;transition:text-decoration-color 200ms ease}[data-ls-cl]:hover{text-decoration-color:#F4F5F6}
[data-ls-spin]{animation:lsSpin .8s linear infinite}@keyframes lsSpin{to{transform:rotate(360deg)}}
[data-ls-btn]{transition:background-color .35s cubic-bezier(.65,0,.35,1),color .35s cubic-bezier(.65,0,.35,1),padding .45s cubic-bezier(.65,0,.35,1),transform 120ms ease}[data-ls-btn] [data-ls-sq]{transition:left .45s cubic-bezier(.65,0,.35,1),background-color .35s,color .35s}
[data-ls-btn]:not([disabled]):hover{background:#F4F5F6!important;color:#0F1114!important;padding-left:var(--pr)!important;padding-right:var(--pl)!important}[data-ls-btn]:not([disabled]):hover [data-ls-sq]{left:4px!important;background:#0F1114!important;color:#FF3B4A!important}
[data-ls-btn]:active{transform:scale(.97)}[data-ls-btn]:focus-visible{outline:2px solid #E0001B;outline-offset:2px}
@media (prefers-reduced-motion:reduce){[data-ls-dot]::after{animation:none!important}[data-ls-spin]{animation-duration:2.4s}}
</style>
</helmet>
<div style="display:grid;grid-template-columns:{{ cols }};gap:{{ gap }};">
<div data-lsc="" style="position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:{{ rad }};border:1px solid #262B31;">
<div style="position:relative;flex:1;min-height:{{ photoH }};overflow:hidden;background:#262B31;">
<img src="assets/services/tech-service.jpg" alt="Бокс DLS Auto Service" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
<div role="status" style="position:absolute;top:{{ bOff }};left:{{ bOff }};display:flex;align-items:center;gap:{{ bGap }};height:{{ bH }};padding:0 {{ bPr }} 0 {{ bPl }};box-sizing:border-box;border-radius:16px;background:#FFFFFF;box-shadow:0 8px 24px -8px rgba(15,17,20,.32);">
<span data-ls-dot="" data-open="{{ openA }}" aria-hidden="true" style="flex-shrink:0;width:{{ dot }};height:{{ dot }};border-radius:999px;background:{{ dotColor }};"></span>
<span style="display:flex;flex-direction:column;"><span style="font:600 {{ bFont }} 'IBM Plex Sans',sans-serif;color:#0F1114;white-space:nowrap;">{{ statusLabel }}</span><sc-if value="{{ closed }}" hint-placeholder-val="{{ false }}"><span style="font:400 14px/1.45 'IBM Plex Sans',sans-serif;color:#5A616A;white-space:nowrap;">Відкриємо о 08:00</span></sc-if></span>
</div>
</div>
<div style="display:flex;flex-direction:column;padding:{{ pad }};">
<h3 style="margin:0;font:600 {{ h3 }} 'Fira Sans Condensed',sans-serif;letter-spacing:-0.02em;color:var(--text);">Запоріжжя</h3>
<div style="margin-top:{{ gapS }};display:grid;grid-template-columns:{{ infoCols }};gap:8px;font:500 18px/1.45 'IBM Plex Sans',sans-serif;color:var(--text);">
<div style="display:flex;flex-direction:column;gap:4px;padding:16px 20px;border-radius:16px;background:rgba(125,132,141,.14);"><span style="font:400 14px/1.45 'IBM Plex Sans',sans-serif;color:var(--text-3);">Адреса</span>Південне шосе, 64</div>
<div style="display:flex;flex-direction:column;gap:4px;padding:16px 20px;border-radius:16px;background:rgba(125,132,141,.14);"><span style="font:400 14px/1.45 'IBM Plex Sans',sans-serif;color:var(--text-3);">Графік</span>Пн–Нд 08:00–20:00</div>
</div>
</div>
</div>
<div ref="{{ cardRef }}" style="display:flex;flex-direction:column;min-height:{{ minH }};padding:{{ pad }};box-sizing:border-box;border-radius:{{ rad }};background:#181B1F;color:#F4F5F6;">
<sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
<h2 style="margin:0;font:600 {{ h2 }} 'Fira Sans Condensed',sans-serif;letter-spacing:-0.02em;color:#F4F5F6;">Залиште заявку <span style="color:#8F8F92;">на консультацію спеціаліста</span></h2>
<div style="margin-top:{{ gapS }};display:grid;grid-template-columns:{{ fCols }};gap:12px;">
<sc-for list="{{ fields }}" as="f" hint-placeholder-count="5">
<div style="grid-column:{{ f.col }};display:flex;flex-direction:column;min-width:0;">
<sc-if value="{{ f.isInput }}" hint-placeholder-val="{{ true }}"><input data-lsf="" type="{{ f.type }}" inputMode="{{ f.im }}" autoComplete="{{ f.ac }}" aria-label="{{ f.label }}" value="{{ f.value }}" placeholder="{{ f.ph }}" aria-invalid="{{ f.invalid }}" onChange="{{ f.onChange }}" onFocus="{{ f.onFocus }}" onBlur="{{ f.onBlur }}" style="display:block;width:100%;height:56px;box-sizing:border-box;padding:0 20px;border:0;border-radius:12px;font:400 16px/1.5 'IBM Plex Sans',sans-serif;color:#F4F5F6;"></sc-if>
<sc-if value="{{ f.isSelect }}" hint-placeholder-val="{{ false }}"><div style="position:relative;"><select data-lsf="" data-empty="{{ f.emptyA }}" aria-label="{{ f.label }}" value="{{ f.value }}" onChange="{{ f.onChange }}" style="display:block;width:100%;height:56px;box-sizing:border-box;padding:0 48px 0 20px;border:0;border-radius:12px;appearance:none;-webkit-appearance:none;font:400 16px/1.5 'IBM Plex Sans',sans-serif;color:#F4F5F6;cursor:pointer;"><option value="" disabled="{{ true }}">Послуга</option><sc-for list="{{ services }}" as="s" hint-placeholder-count="9"><option value="{{ s }}">{{ s }}</option></sc-for></select><span aria-hidden="true" style="position:absolute;right:16px;top:16px;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:999px;background:#3B4148;color:#F4F5F6;pointer-events:none;"><svg data-ccs="" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.25 5 6.25 7 4.25"></path></svg></span></div></sc-if>
<sc-if value="{{ f.isArea }}" hint-placeholder-val="{{ false }}"><textarea data-lsf="" aria-label="{{ f.label }}" value="{{ f.value }}" placeholder="{{ f.ph }}" onChange="{{ f.onChange }}" style="display:block;width:100%;height:112px;box-sizing:border-box;padding:16px 20px;border:0;border-radius:12px;resize:none;font:400 16px/1.5 'IBM Plex Sans',sans-serif;color:#F4F5F6;"></textarea></sc-if>
<sc-if value="{{ f.err }}" hint-placeholder-val="{{ false }}"><div role="alert" style="display:flex;align-items:center;gap:8px;padding:8px 4px 0;font:400 14px/1.45 'IBM Plex Sans',sans-serif;color:#F2707A;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>{{ f.err }}</div></sc-if>
</div>
</sc-for>
</div>
<div style="margin-top:{{ gapS }};display:flex;"><button type="button" data-ls-btn="" disabled="{{ loading }}" aria-busy="{{ loading }}" onClick="{{ submit }}" style="--pl:32px;--pr:68px;position:relative;display:flex;align-items:center;justify-content:{{ btnJust }};width:{{ btnW }};height:56px;box-sizing:border-box;padding:0 var(--pr) 0 var(--pl);border:0;border-radius:999px;background:#E0001B;color:#F4F5F6;font:600 18px/1 'IBM Plex Sans',sans-serif;white-space:nowrap;cursor:{{ btnCursor }};">{{ btnLabel }}<span data-ls-sq="" style="position:absolute;top:4px;left:calc(100% - 52px);display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:999px;background:#F4F5F6;color:#E0001B;"><sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><svg data-ls-spin="" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></sc-if><sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></sc-if></span></button></div>
</sc-if>
<sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
<div role="status" style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;">
<span style="display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:999px;background:#262B31;color:#2F9E5B;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
<h2 style="margin:24px 0 0;font:600 {{ h2 }} 'Fira Sans Condensed',sans-serif;letter-spacing:-0.02em;color:#F4F5F6;">Заявку отримали</h2>
<p style="margin:12px 0 0;font:400 16px/1.5 'IBM Plex Sans',sans-serif;color:#A9AFB6;">Передзвонимо за 5–10 хвилин у робочий час</p>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;820px&quot;},&quot;mob&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const SERVICES = ['Діагностика', 'Технічне обслуговування', 'Двигун', 'Ходова та кермування', 'КПП та трансмісія', 'Гальмівна система', 'Автоелектрика', 'Кузовні та зварювальні', 'Не знаю — потрібна діагностика'];
const fmtPhone = (raw, prev) => {
  raw = String(raw); prev = String(prev || '');
  let d = raw.replace(/\D/g, ''); const pd = prev.replace(/\D/g, '');
  if (raw.length < prev.length && d.length === pd.length) d = d.slice(0, -1);
  if (!d || (d.length <= 3 && raw.length < prev.length)) return '';
  if (!d.startsWith('380')) d = '380' + d.replace(/^3?8?0?/, '');
  d = d.slice(0, 12);
  let o = '+38(' + d.slice(2, 5);
  if (d.length >= 5) o += ') ' + d.slice(5, 8);
  if (d.length > 8) o += ' ' + d.slice(8, 10);
  if (d.length > 10) o += ' ' + d.slice(10, 12);
  return o;
};
const kyivHour = () => { try { return +new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Kyiv', hour: 'numeric', hourCycle: 'h23' }).format(new Date()); } catch (_) { return new Date().getHours(); } };
class Component extends DCLogic {
  cardRef = React.createRef();
  state = { v: { name: '', phone: '', car: '', service: '', issue: '' }, errs: {}, status: 'idle', minH: null, hour: kyivHour() };
  componentDidMount() { this.iv = setInterval(() => this.setState({ hour: kyivHour() }), 60000); }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.t); }
  set(k, val) { this.setState(s => { const errs = { ...s.errs }; delete errs[k]; return { v: { ...s.v, [k]: val }, errs }; }); }
  submit = () => {
    if (this.state.status !== 'idle') return;
    const v = this.state.v, errs = {};
    if (!v.name.trim()) errs.name = "Вкажіть ім'я";
    if (v.phone.replace(/\D/g, '').length !== 12) errs.phone = 'Введіть номер у форматі +38(0XX) XXX XX XX';
    if (!v.car.trim()) errs.car = 'Вкажіть марку, модель і рік';
    if (Object.keys(errs).length) { this.setState({ errs }); return; }
    const h = this.cardRef.current ? this.cardRef.current.offsetHeight + 'px' : null;
    this.setState({ status: 'loading', minH: h });
    this.t = setTimeout(() => this.setState({ status: 'done' }), 1600);
  };
  renderVals() {
    const mob = !!this.props.mob, { v, errs, status, hour } = this.state;
    const open = hour >= 8 && hour < 20;
    const def = {
      name: { label: "Ім'я", type: 'text', ac: 'given-name', ph: "Ім'я" },
      phone: { label: 'Телефон', type: 'tel', im: 'tel', ac: 'tel', ph: 'Телефон' },
      car: { label: 'Авто', type: 'text', ac: 'off', ph: 'Авто: марка, модель, рік' },
      service: { label: 'Послуга', kind: 'select' },
      issue: { label: 'Що турбує', kind: 'area', ph: "Що турбує (необов'язково)" }
    };
    const order = mob ? ['phone', 'name', 'car', 'service', 'issue'] : ['name', 'phone', 'car', 'service', 'issue'];
    const fields = order.map((k, i) => {
      const d = def[k], err = errs[k];
      return {
        ...d, value: v[k], err: err || '', invalid: err ? 'true' : 'false', im: d.im || 'text', ac: d.ac || 'off',
        isInput: !d.kind, isSelect: d.kind === 'select', isArea: d.kind === 'area', emptyA: v[k] ? undefined : '',
        col: !mob && i < 2 ? 'span 1' : '1 / -1',
        onChange: (e) => this.set(k, k === 'phone' ? fmtPhone(e.target.value, v.phone) : e.target.value),
        onFocus: () => this.setState(s => ({ v: k === 'phone' && !s.v.phone ? { ...s.v, phone: '+38(0' } : s.v })),
        onBlur: () => this.setState(s => ({ v: k === 'phone' && s.v.phone.replace(/\D/g, '').length <= 3 ? { ...s.v, phone: '' } : s.v }))
      };
    });
    const loading = status === 'loading';
    return {
      cardRef: this.cardRef, fields, services: SERVICES,
      cols: mob ? 'minmax(0,1fr)' : 'repeat(2,minmax(0,1fr))', gap: mob ? '16px' : '24px', rad: mob ? '24px' : '32px', pad: mob ? '24px' : '48px',
      photoH: mob ? '280px' : '360px', h2: mob ? '32px/1.15' : '48px/1.15', h3: mob ? '32px/1.15' : '48px/1.15',
      gapS: mob ? '24px' : '32px', gapL: mob ? '32px' : '48px', infoCols: mob ? 'minmax(0,1fr)' : 'repeat(2,minmax(0,1fr))', fCols: mob ? 'minmax(0,1fr)' : 'repeat(2,minmax(0,1fr))',
      bOff: mob ? '16px' : '24px', bH: mob ? '40px' : '50px', bPl: mob ? '14px' : '16px', bPr: mob ? '16px' : '22px', bGap: mob ? '8px' : '12px', dot: mob ? '10px' : '12px', bFont: mob ? '14px/1.3' : '14px/1.3',
      openA: open ? '' : undefined, closed: !open, statusLabel: open ? 'Зараз відчинено' : 'Зараз зачинено', dotColor: open ? '#2F9E5B' : '#E0A400',
      phFlex: mob ? '1 1 100%' : '0 0 auto',
      minH: this.state.minH || 'auto', isForm: status !== 'done', isDone: status === 'done', loading, idle: !loading,
      btnLabel: loading ? 'Відправляємо...' : 'Відправити заявку', btnW: mob ? '100%' : 'auto', btnJust: mob ? 'center' : 'flex-start', btnCursor: loading ? 'progress' : 'pointer',
      submit: this.submit
    };
  }
}
</script>
</body>
</html>
